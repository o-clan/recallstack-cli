name: Publish CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-version.sh
          version="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          }

      - name: Test native CLI
        run: go test ./...

      - name: Vet native CLI
        run: go vet ./...

      - name: Build and smoke release assets
        run: bash ./scripts/package-cli-smoke.sh

      - name: Scan release binaries for vulnerabilities
        run: bash ./scripts/vulncheck-release.sh

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected=(
            "recallstack_${version}_linux_amd64"
            "recallstack_${version}_linux_arm64"
            "recallstack_${version}_darwin_amd64"
            "recallstack_${version}_darwin_arm64"
            "recallstack_${version}_windows_amd64.exe"
            "recallstack_${version}_windows_arm64.exe"
            "SHA256SUMS"
            "install.sh"
            "install.ps1"
          )
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for name in "${expected[@]}"; do
            grep -Fx "$name" <<< "$assets" >/dev/null || {
              echo "Release is missing $name" >&2
              exit 1
            }
          done

  publish-npm-retirement:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install --global npm@latest

      - name: Publish final npm retirement release
        run: bash .github/npm-retirement/publish.sh
